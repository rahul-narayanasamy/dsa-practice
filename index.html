<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#f4f0e6" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-title" content="DSA" />
  <title>DSA practice</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231f3d2b'/%3E%3Ctext x='16' y='22' text-anchor='middle' font-size='16' font-family='Georgia' fill='%23f4f0e6'%3ES%3C/text%3E%3C/svg%3E" />
  <style>
    :root {
      color-scheme: light;
      --ink: #1c1915;
      --muted: #5c564c;
      --line: #e2dacb;
      --paper: #f4f0e6;
      --card: #fffdf8;
      --green: #1f3d2b;
      --green-2: #2f5a40;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--paper);
      color: var(--ink);
      font: 18px/1.5 Georgia, "Iowan Old Style", Palatino, serif;
    }
    header, main, footer { width: min(46rem, calc(100% - 1.5rem)); margin: 0 auto; }
    header { padding: 1.25rem 0 0.5rem; }
    .kicker {
      margin: 0;
      color: var(--muted);
      font: 0.78rem/1.2 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    h1 { font-size: 1.85rem; line-height: 1.2; margin: 0.35rem 0 0.4rem; }
    .status { margin: 0; color: var(--muted); font-size: 1rem; }
    nav {
      display: flex;
      gap: 0.4rem;
      flex-wrap: wrap;
      padding: 0.9rem 0 0.2rem;
    }
    nav button {
      border: 1px solid var(--line);
      background: transparent;
      color: var(--ink);
      border-radius: 999px;
      padding: 0.35rem 0.75rem;
      font: 0.85rem/1.2 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }
    nav button[aria-current="page"] {
      background: var(--green);
      border-color: var(--green);
      color: #f4f0e6;
    }
    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 16px;
      padding: 1rem 1rem 1.1rem;
      margin: 0.8rem 0 1rem;
    }
    .session-id {
      margin: 0;
      font: 0.85rem/1.2 ui-sans-serif, system-ui, sans-serif;
      color: var(--green-2);
    }
    button.primary, button.ghost {
      display: block;
      width: 100%;
      min-height: 48px;
      border-radius: 12px;
      font: 600 1rem/1.2 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
    }
    button.primary {
      border: 0;
      background: var(--green);
      color: #f4f0e6;
    }
    button.primary:active { background: var(--green-2); }
    button.ghost {
      margin-top: 0.5rem;
      border: 1px solid var(--line);
      background: transparent;
      color: var(--muted);
    }
    .markdown h2, .markdown h3 { font-size: 1.15rem; margin: 1.1rem 0 0.4rem; }
    .markdown p, .markdown li { font-size: 1.02rem; }
    .markdown a { color: var(--green-2); }
    .markdown pre {
      overflow-x: auto;
      padding: 0.8rem;
      background: #f6f1e6;
      border-radius: 10px;
      font-size: 0.86rem;
    }
    .markdown code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 0.9em; }
    .markdown details { margin: 0.8rem 0; }
    .meter {
      height: 8px;
      margin: 0.85rem 0 0.2rem;
      background: #e6dfd2;
      border-radius: 999px;
      overflow: hidden;
    }
    .meter span {
      display: block;
      height: 100%;
      background: var(--green);
      border-radius: inherit;
    }
    .meta-row, .chip-row, .chapter-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      align-items: center;
    }
    .chapter-row, .chip-row { margin: 0.3rem 0 0.8rem; }
    .chapter-row { padding-bottom: 0.2rem; }
    .pill, .chip, .where {
      font: 700 0.72rem/1.2 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .pill, .chip {
      border-radius: 999px;
      padding: 0.28rem 0.55rem;
      border: 1px solid transparent;
    }
    .pill.easy, .chip.on.easy { background: #e5f6eb; color: #14532d; }
    .pill.medium { background: #fff1d6; color: #7a4b00; }
    .pill.hard, .pill.stretch { background: #ffe4de; color: #8f1d1d; }
    .pill.review { background: #e5f0fa; color: #1a3e66; }
    .pill.checkpoint { background: #ece7ff; color: #3a2d7a; }
    .pill.warmup { background: #efe8dc; color: #3f3a33; }
    .where { color: var(--muted); text-transform: none; letter-spacing: 0; font-weight: 600; }
    .watch {
      margin: 0.85rem 0 0.4rem;
      padding: 0.75rem 0.85rem;
      border-radius: 12px;
      border-left: 4px solid var(--green);
      background: #f7f3ea;
    }
    .watch strong {
      display: block;
      margin-bottom: 0.2rem;
      font: 700 0.72rem/1.2 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .watch.easy { background: #eef8f1; border-color: #1f7a3a; }
    .watch.medium { background: #fff6e8; border-color: #c47b00; }
    .watch.hard, .watch.stretch { background: #fff1ee; border-color: #b42318; }
    .watch.review { background: #eef4fb; border-color: #1d4e89; }
    .watch.checkpoint { background: #f4f1ff; border-color: #4c3f91; }
    .watch.warmup { background: #f6f1e8; border-color: #6b645b; }
    .textlink {
      margin: 0.2rem 0 0.8rem;
      padding: 0;
      border: 0;
      background: none;
      color: var(--green-2);
      font: 600 0.95rem/1.3 ui-sans-serif, system-ui, sans-serif;
      cursor: pointer;
      text-decoration: underline;
    }
    .blurb { margin: 0.2rem 0 0.7rem; color: var(--muted); }
    .chapter-row button, .chip {
      cursor: pointer;
      background: transparent;
      color: var(--ink);
      border: 1px solid var(--line);
    }
    .chapter-row button {
      border-radius: 999px;
      padding: 0.4rem 0.7rem;
      font: 600 0.82rem/1.2 ui-sans-serif, system-ui, sans-serif;
      white-space: nowrap;
    }
    .chapter-row button[aria-current="true"], .chip[aria-current="true"] {
      background: var(--green);
      border-color: var(--green);
      color: #f4f0e6;
    }
    .steps { display: flex; flex-direction: column; gap: 0.55rem; margin: 0 0 1.2rem; }
    .step {
      display: grid;
      grid-template-columns: auto 1fr;
      gap: 0.35rem 0.7rem;
      width: 100%;
      text-align: left;
      padding: 0.75rem 0.8rem;
      border: 1px solid var(--line);
      border-radius: 14px;
      background: var(--card);
      color: inherit;
      font: inherit;
      cursor: pointer;
    }
    .step.now { box-shadow: inset 3px 0 0 var(--green); }
    .step.done { opacity: 0.72; }
    .step .n {
      width: 1.8rem;
      height: 1.8rem;
      border-radius: 999px;
      display: grid;
      place-items: center;
      background: #efe8dc;
      font: 700 0.78rem/1 ui-sans-serif, system-ui, sans-serif;
    }
    .step.now .n { background: var(--green); color: #f4f0e6; }
    .step .who {
      display: block;
      color: var(--green-2);
      font: 700 0.75rem/1.2 ui-sans-serif, system-ui, sans-serif;
      letter-spacing: 0.03em;
      text-transform: uppercase;
    }
    .step strong { display: block; font-size: 1.02rem; }
    .step .titleline { display: flex; flex-wrap: wrap; gap: 0.35rem 0.5rem; align-items: center; }
    .step .bite {
      grid-column: 2;
      margin: 0;
      color: var(--muted);
      font-size: 0.92rem;
    }
    .countline {
      margin: 0 0 0.6rem;
      font: 0.85rem/1.3 ui-sans-serif, system-ui, sans-serif;
      color: var(--muted);
    }
    footer {
      padding: 0.2rem 0 2.5rem;
      color: var(--muted);
      font: 0.85rem/1.45 ui-sans-serif, system-ui, sans-serif;
    }
    textarea {
      width: 100%;
      min-height: 5rem;
      margin: 0.4rem 0;
      font: 0.8rem/1.4 ui-monospace, Menlo, monospace;
    }
    .row { display: flex; gap: 0.5rem; }
    .row button { flex: 1; }
    .error { color: #8a2b16; }
  </style>
</head>
<body>
  <header>
    <p class="kicker">DSA practice</p>
    <h1 id="title">Loading the next session</h1>
    <p class="status" id="status"></p>
    <div class="meter" id="meter" hidden><span id="meter-bar"></span></div>
    <nav aria-label="Sections">
      <button type="button" data-view="today">Today</button>
      <button type="button" data-view="path">Path</button>
      <button type="button" data-view="plan">Full plan</button>
      <button type="button" data-view="method">How to solve</button>
    </nav>
  </header>
  <main id="main"></main>
  <footer>
    <p>Saved in this browser. The same check on your phone and on your laptop are separate.</p>
    <details>
      <summary>Copy or restore progress</summary>
      <textarea id="backup" spellcheck="false"></textarea>
      <div class="row">
        <button type="button" class="ghost" id="copy">Copy</button>
        <button type="button" class="ghost" id="restore">Restore</button>
      </div>
    </details>
  </footer>
  <script src="site.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked@15.0.12/marked.min.js"></script>
  <script>
    const DONE_KEY = "dsa-practice-done-v1";
    const CACHE_KEY = "dsa-practice-cache-v1";
    const VIEWS = ["today", "path", "plan", "method"];
    const state = {
      view: location.hash.replace("#", "") || "today",
      sessions: [],
      plan: "",
      method: "",
      done: loadDone(),
      error: "",
      chapterId: null,
      filter: "all",
      reading: null,
    };
    if (state.view === "list") state.view = "path";

    function loadDone() {
      try {
        const parsed = JSON.parse(localStorage.getItem(DONE_KEY) || "{}");
        return parsed && typeof parsed === "object" ? parsed : {};
      } catch (error) {
        return {};
      }
    }

    function saveDone() {
      localStorage.setItem(DONE_KEY, JSON.stringify(state.done));
    }

    function renderMarkdown(text) {
      if (!window.marked) return "<pre>" + escapeHtml(text) + "</pre>";
      const html = marked.parse(text, { gfm: true });
      const holder = document.createElement("div");
      holder.innerHTML = html;
      holder.querySelectorAll("a").forEach(function (link) {
        const href = link.getAttribute("href") || "";
        if (href.includes("HOW-TO-SOLVE.md")) link.setAttribute("href", "#method");
        else if (href.includes("PLAN.md")) link.setAttribute("href", "#plan");
        else if (href.includes("PROGRESS.md")) link.setAttribute("href", "#list");
        else if (/^https?:/.test(href)) {
          link.setAttribute("target", "_blank");
          link.setAttribute("rel", "noopener noreferrer");
        }
      });
      return holder.innerHTML;
    }

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function biteLabel(difficulty) {
      if (difficulty === "warmup") return "What you are learning";
      if (difficulty === "review") return "Why this repeat";
      if (difficulty === "checkpoint") return "What this proves";
      if (difficulty === "stretch") return "Why this is a stretch";
      if (difficulty === "hard" || difficulty === "medium") return "Where it gets hard";
      return "Watch for";
    }

    function pill(difficulty) {
      return "<span class='pill " + difficulty + "'>" + escapeHtml(DSA.difficultyLabel(difficulty)) + "</span>";
    }

    function watchBox(step) {
      if (!step) return "";
      return "<p class='watch " + step.difficulty + "'><strong>" + escapeHtml(biteLabel(step.difficulty)) + "</strong>" + escapeHtml(step.bite) + "</p>";
    }

    function sessionById(id) {
      for (let i = 0; i < state.sessions.length; i++) {
        if (state.sessions[i].id === id) return state.sessions[i];
      }
      return null;
    }

    function updateMeter() {
      const meter = document.getElementById("meter");
      const bar = document.getElementById("meter-bar");
      const total = state.sessions.length;
      if (!total) {
        meter.hidden = true;
        return;
      }
      const finished = DSA.finishedCount(state.sessions, state.done);
      meter.hidden = false;
      bar.style.width = Math.round((100 * finished) / total) + "%";
    }

    function weekSentence() {
      const today = DSA.localDate(new Date());
      const count = DSA.weekCount(state.sessions, state.done, today);
      const finished = DSA.finishedCount(state.sessions, state.done);
      const total = state.sessions.length;
      if (!total) return "";
      if (finished >= total) {
        return "You finished all " + total + " sessions. Two sittings a week keep the skill: one redo, and one new problem in a pattern you already know.";
      }
      if (count === 0) {
        return "This week: 0 finished. One finished session completes the week. " + finished + " of " + total + " done overall.";
      }
      return "This week: " + count + " finished. The week already counts. " + finished + " of " + total + " done overall.";
    }

    function render() {
      const title = document.getElementById("title");
      const status = document.getElementById("status");
      const main = document.getElementById("main");
      document.querySelectorAll("nav button").forEach(function (button) {
        button.setAttribute("aria-current", button.dataset.view === state.view ? "page" : "false");
      });
      if (state.error) {
        title.textContent = "The plan did not load";
        status.textContent = "";
        main.innerHTML = '<p class="error">' + escapeHtml(state.error) + "</p>";
        return;
      }
      status.textContent = weekSentence();
      updateMeter();
      if (state.view === "plan") {
        title.textContent = "Full plan";
        main.innerHTML = '<article class="markdown">' + renderMarkdown(state.plan) + "</article>";
        return;
      }
      if (state.view === "method") {
        title.textContent = "How to solve one problem";
        main.innerHTML = '<article class="markdown">' + renderMarkdown(state.method) + "</article>";
        return;
      }
      if (state.view === "path") {
        renderPath(title, main);
        return;
      }
      renderToday(title, main);
    }

    function renderToday(title, main) {
      const next = DSA.nextSession(state.sessions, state.done);
      if (!next) {
        title.textContent = "Plan complete";
        main.innerHTML = "<article class='card'><p>Open the path and use the maintenance loop in the full plan: one redo, and one new problem, twice a week.</p></article>";
        return;
      }
      const step = DSA.stepFor(next.id);
      const stats = step ? DSA.chapterStats(step.chapter, state.sessions, state.done) : null;
      title.textContent = "Next session";
      const canUndo = state.sessions.some(function (session) {
        return !session.checked && state.done[session.id];
      });
      main.innerHTML =
        "<article class='card'>" +
          "<div class='meta-row'>" +
            (step ? pill(step.difficulty) : "") +
            (step ? "<span class='where'>" + escapeHtml(step.pattern) + " · " + escapeHtml(step.chapter.name) + " · " + stats.finished + " of " + stats.total + " in this chapter</span>" : "") +
          "</div>" +
          "<p class='session-id'>" + next.id + "</p>" +
          "<h2>" + escapeHtml(next.title) + "</h2>" +
          watchBox(step) +
          "<button type='button' class='textlink' id='show-path'>See this on the pattern path</button>" +
          "<div class='markdown'>" + renderMarkdown(DSA.sectionBody(state.plan, next.id)) + "</div>" +
          "<button type='button' class='primary' id='finish'>I finished " + next.id + "</button>" +
          (canUndo ? "<button type='button' class='ghost' id='undo'>Undo the last finish</button>" : "") +
        "</article>";
    }

    function renderPath(title, main) {
      const next = DSA.nextSession(state.sessions, state.done);
      const fallback = next ? DSA.stepFor(next.id).chapter.id : DSA.chapters[0].id;
      const chapterId = state.chapterId || fallback;
      const chapter = DSA.chapters.filter(function (item) { return item.id === chapterId; })[0] || DSA.chapters[0];
      title.textContent = "Pattern path";
      const patterns = [];
      chapter.steps.forEach(function (step) {
        if (patterns.indexOf(step[1]) < 0) patterns.push(step[1]);
      });
      const stats = DSA.chapterStats(chapter, state.sessions, state.done);
      const chapters = DSA.chapters.map(function (item, index) {
        const itemStats = DSA.chapterStats(item, state.sessions, state.done);
        const current = item.id === chapter.id;
        return "<button type='button' data-chapter='" + item.id + "' aria-current='" + current + "'>" + (index + 1) + " " + escapeHtml(item.name) + " · " + itemStats.finished + "/" + itemStats.total + "</button>";
      }).join("");
      const filters = ["all"].concat(patterns).map(function (name) {
        const current = state.filter === name;
        return "<button type='button' class='chip' data-filter='" + escapeHtml(name) + "' aria-current='" + current + "'>" + (name === "all" ? "All patterns" : escapeHtml(name)) + "</button>";
      }).join("");
      const steps = chapter.steps.filter(function (step) {
        return state.filter === "all" || step[1] === state.filter;
      }).map(function (step, index) {
        const session = sessionById(step[0]);
        const done = session && DSA.isDone(session, state.done);
        const isNext = next && next.id === step[0];
        const cls = "step" + (isNext ? " now" : "") + (done ? " done" : "");
        const mark = done ? "✓" : String(index + 1);
        return "<button type='button' class='" + cls + "' data-open='" + step[0] + "'>" +
          "<span class='n'>" + mark + "</span>" +
          "<span><span class='who'>" + escapeHtml(step[1]) + (isNext ? " · now" : "") + "</span><span class='titleline'><strong>" + escapeHtml(session ? session.title : step[0]) + "</strong>" + pill(step[2]) + "</span></span>" +
          "<p class='bite'>" + escapeHtml(step[3]) + "</p>" +
        "</button>";
      }).join("");
      let detail = "";
      if (state.reading) {
        const session = sessionById(state.reading);
        const step = DSA.stepFor(state.reading);
        if (session && step) {
          const isNext = next && next.id === session.id;
          detail = "<article class='card' id='reading'>" +
            "<div class='meta-row'>" + pill(step.difficulty) + "<span class='where'>" + escapeHtml(step.pattern) + "</span></div>" +
            "<p class='session-id'>" + session.id + "</p><h2>" + escapeHtml(session.title) + "</h2>" +
            watchBox(step) +
            "<div class='markdown'>" + renderMarkdown(DSA.sectionBody(state.plan, session.id)) + "</div>" +
            (isNext ? "<button type='button' class='primary' id='finish'>I finished " + session.id + "</button>" : "<p class='countline'>The finish button stays on the next session, so the path keeps its order.</p>") +
          "</article>";
        }
      }
      main.innerHTML =
        "<div class='chapter-row'>" + chapters + "</div>" +
        "<p class='blurb'>" + escapeHtml(chapter.blurb) + "</p>" +
        "<p class='countline'>" + stats.finished + " of " + stats.total + " finished in this chapter. Steps stay in the order you do them. The color is the difficulty.</p>" +
        "<div class='chip-row'>" + filters + "</div>" +
        detail +
        "<div class='steps'>" + steps + "</div>";
    }

    async function loadText(name) {
      const response = await fetch(name);
      if (!response.ok) throw new Error("Could not load " + name);
      return response.text();
    }

    async function start() {
      try {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        const [progress, plan, method] = await Promise.all([
          loadText("PROGRESS.md"),
          loadText("PLAN.md"),
          loadText("HOW-TO-SOLVE.md"),
        ]);
        state.sessions = DSA.parseSessions(progress);
        state.plan = plan;
        state.method = method;
        localStorage.setItem(CACHE_KEY, JSON.stringify({ progress: progress, plan: plan, method: method }));
      } catch (error) {
        const cached = JSON.parse(localStorage.getItem(CACHE_KEY) || "null");
        if (!cached) {
          state.error = "This page needs the plan files beside it. Open the hosted site, or run a local server from the dsa-practice folder.";
          render();
          return;
        }
        state.sessions = DSA.parseSessions(cached.progress);
        state.plan = cached.plan;
        state.method = cached.method;
      }
      if (!state.sessions.length) {
        state.error = "No sessions were found in PROGRESS.md.";
      }
      render();
    }

    document.querySelectorAll("nav button").forEach(function (button) {
      button.addEventListener("click", function () {
        state.view = button.dataset.view;
        history.replaceState(null, "", "#" + state.view);
        render();
        window.scrollTo(0, 0);
      });
    });

    document.getElementById("main").addEventListener("click", function (event) {
      const chapter = event.target.closest("[data-chapter]");
      if (chapter) {
        state.chapterId = chapter.dataset.chapter;
        state.filter = "all";
        state.reading = null;
        render();
        return;
      }
      const filter = event.target.closest("[data-filter]");
      if (filter) {
        state.filter = filter.dataset.filter;
        state.reading = null;
        render();
        return;
      }
      const open = event.target.closest("[data-open]");
      if (open) {
        state.reading = state.reading === open.dataset.open ? null : open.dataset.open;
        render();
        const reading = document.getElementById("reading");
        if (reading) reading.scrollIntoView({ block: "start" });
        return;
      }
      if (event.target.id === "show-path") {
        const next = DSA.nextSession(state.sessions, state.done);
        const step = next && DSA.stepFor(next.id);
        state.chapterId = step ? step.chapter.id : state.chapterId;
        state.filter = step ? step.pattern : "all";
        state.view = "path";
        history.replaceState(null, "", "#path");
        render();
        window.scrollTo(0, 0);
        return;
      }
      if (event.target.id === "finish") {
        const next = DSA.nextSession(state.sessions, state.done);
        if (!next) return;
        state.done = DSA.markDone(state.done, next.id, DSA.localDate(new Date()));
        state.reading = null;
        saveDone();
        render();
      }
      if (event.target.id === "undo") {
        state.done = DSA.undoLast(state.sessions, state.done);
        state.reading = null;
        saveDone();
        render();
      }
    });

    document.getElementById("copy").addEventListener("click", async function () {
      const text = JSON.stringify(state.done);
      document.getElementById("backup").value = text;
      try { await navigator.clipboard.writeText(text); } catch (error) {}
    });

    document.getElementById("restore").addEventListener("click", function () {
      try {
        const parsed = JSON.parse(document.getElementById("backup").value || "{}");
        if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) return;
        state.done = parsed;
        saveDone();
        render();
      } catch (error) {}
    });

    if (!VIEWS.includes(state.view)) state.view = "today";
    window.addEventListener("hashchange", function () {
      const view = location.hash.replace("#", "");
      if (!VIEWS.includes(view)) return;
      state.view = view;
      render();
      window.scrollTo(0, 0);
    });
    start();
  </script>
</body>
</html>
